const EX_BY_NAME = Object.fromEntries(EXERCISES.map(e=>[e.name,e]));
// Pick a few sensible exercises for a category (for auto-fill when a focus is selected).
function autoPickFor(catId, mode, existingNames, count){
  count = count||3;
  let pool=EXERCISES.filter(e=>e.cat===catId);
  if(mode==="beginner") pool=pool.filter(e=>e.lvl!=="advanced");
  if(!pool.length) pool=EXERCISES.filter(e=>e.cat===catId); // fall back if beginner filter emptied it
  // prefer not-already-present, then take a spread
  const fresh=pool.filter(e=>!(existingNames||[]).includes(e.name));
  const src=fresh.length>=count?fresh:pool;
  // bias toward earlier (more standard) entries but include some variety
  const chosen=[];
  const step=Math.max(1,Math.floor(src.length/count));
  for(let i=0;i<src.length && chosen.length<count;i+=step) chosen.push(src[i]);
  // top up if needed
  for(let i=0;i<src.length && chosen.length<count;i++){ if(!chosen.includes(src[i])) chosen.push(src[i]); }
  return chosen.map(e=>({id:uid(),name:e.name,cat:e.cat,sets:e.sets,reps:e.reps,tip:e.tip}));
}

// The repeating training sequence (non-rest workouts), cycled across training days.
const TRAINING_SEQUENCE = ["PUSH","PULL","LEGS","UPPER","ARMS"];
const WORKOUT_TYPES = ["PUSH","PULL","LEGS","UPPER","ARMS","SWIM","REST"];

// Lay the week. `pins` is a map dayKey -> workout type ("PUSH".."SWIM","REST").
// Pinned days are placed exactly as chosen; unpinned days auto-fill with the
// training sequence (flowing around pins), and any day not pinned and not
// reached by auto-fill defaults to REST only if it has no pin.
// `auto` is the set of days that should auto-train (not pinned, not auto-rest).
// Simpler model: every day is either pinned to a type, or auto. Auto days get
// the next sequence workout; pinned REST days are just rest.
function buildWeek(pins, fromKey, basePlan, seq){
  pins = pins||{};
  seq = (seq&&seq.length)?seq:TRAINING_SEQUENCE;
  const keys = DAY_DEFS.map(d=>d.key);
  const fromIdx = fromKey ? keys.indexOf(fromKey) : 0;
  // continue the sequence based on training days (auto or pinned-non-rest) before fromIdx
  let seqIdx = 0;
  for(let i=0;i<fromIdx;i++){ const t=pins[keys[i]]; if(t&&t!=="REST") seqIdx++; else if(!t){ const bt=(basePlan&&basePlan[keys[i]]?.title||"").toUpperCase(); if(bt&&bt!=="REST") seqIdx++; } }
  const out = basePlan ? {...basePlan} : {};
  for(let i=fromIdx;i<keys.length;i++){
    const k=keys[i]; const pin=pins[k];
    if(pin){ out[k]=WORKOUT_BUILDERS[pin](); if(pin!=="REST") seqIdx++; }
    else { const type=seq[seqIdx % seq.length]; out[k]=WORKOUT_BUILDERS[type](); seqIdx++; }
  }
  return out;
}

function uid(){ return Math.random().toString(36).slice(2,9); }
// Global "back" stack. Each open layer registers a close-handler; the left-edge
// swipe (and the single global listener) invokes only the topmost handler, so
// nested layers close one at a time without double-firing.
const BACK_STACK=[];
let BACK_LISTENER_INIT=false;
function initBackListener(){
  if(BACK_LISTENER_INIT) return; BACK_LISTENER_INIT=true;
  let sx=0,sy=0,tracking=false;
  document.addEventListener("touchstart",e=>{ const t=e.touches[0]; if(t.clientX<=28){ sx=t.clientX; sy=t.clientY; tracking=true; } else tracking=false; },{passive:true});
  document.addEventListener("touchend",e=>{ if(!tracking) return; tracking=false; const t=e.changedTouches[0]; const dx=t.clientX-sx,dy=t.clientY-sy; if(dx>60&&Math.abs(dy)<50){ const fn=BACK_STACK[BACK_STACK.length-1]; if(fn){ try{navigator.vibrate&&navigator.vibrate(8);}catch{} fn(); } } },{passive:true});
}
// Register a back-handler while `active` is true. Topmost registered wins.
function useBackHandler(active, handler){
  const ref=useRef(handler); ref.current=handler;
  useEffect(()=>{
    initBackListener();
    if(!active) return;
    const entry=()=>ref.current();
    BACK_STACK.push(entry);
    return ()=>{ const i=BACK_STACK.indexOf(entry); if(i>=0) BACK_STACK.splice(i,1); };
  },[active]);
}
function getTodayKey(){ return ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()]; }
function fmtDate(ts){ return new Date(ts).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); }
function fmtTime(ts){ return new Date(ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }
function isoWeek(d){ const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=dt.getUTCDay()||7; dt.setUTCDate(dt.getUTCDate()+4-day); const ys=new Date(Date.UTC(dt.getUTCFullYear(),0,1)); const wk=Math.ceil((((dt-ys)/86400000)+1)/7); return dt.getUTCFullYear()+"-W"+String(wk).padStart(2,"0"); }
// Current ISO week in Europe/Bucharest (EEST) — week boundary is Monday 00:00 local.
function eestWeek(now){
  now = now||new Date();
  // get Y/M/D as seen in Bucharest, then compute ISO week from that calendar date
  let parts;
  try{ const f=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Bucharest",year:"numeric",month:"2-digit",day:"2-digit"}); parts=f.format(now); }
  catch{ parts=null; }
  let y,m,dd;
  if(parts){ const [Y,M,D]=parts.split("-").map(Number); y=Y; m=M-1; dd=D; }
  else { y=now.getFullYear(); m=now.getMonth(); dd=now.getDate(); }
  return isoWeek(new Date(y,m,dd));
}

const WEEK_TITLE={PUSH:"PUSH",PULL:"PULL",LEGS:"LEGS",UPPER:"UPPER PUMP",ARMS:"ARMS",SWIM:"SWIM",REST:"REST"};
const CYCLE=["AUTO","PUSH","PULL","LEGS","UPPER","ARMS","SWIM","REST"];
function WeekSetup({plan, todayKey, onApply, onClose, toast}){
  // pins: dayKey -> workout type. Absent = AUTO (sequence fills it).

  const fromKey = scope==="full" ? keys[0] : todayKey;
  const cycle=k=>setPins(p=>{ const cur=p[k]?CYCLE.indexOf(p[k]):0; const next=CYCLE[(cur+1)%CYCLE.length]; const n={...p}; if(next==="AUTO") delete n[k]; else n[k]=next; return n; });
  // live preview
  const preview = buildWeek(pins, fromKey, scope==="full"?null:plan);
  const trainCount = DAY_DEFS.filter(d=>typeOfTitle(preview[d.key]?.title)!=="REST").length;
  const apply=()=>{ onApply(pins,scope); onClose(); };
  const colorFor=t=>({PUSH:"#ff6b6b",PULL:"#4dabf7",LEGS:"#69db7c","UPPER PUMP":"#ffa94d",ARMS:"#c084fc",SWIM:"#4dd0ff",REST:"#6b6b7a"})[(t||"").toUpperCase()]||"#e8ff47";

      h("p",{style:{fontSize:"0.72rem",color:"var(--muted)",lineHeight:1.6,marginBottom:14}},"Days set to AUTO fill with your rotation (Push → Pull → Legs → Upper → Swim). Tap any day to override it — pick any workout you want, repeats allowed. Tap again to cycle through the options."),
      // scope

      h("p",{style:{fontSize:"0.64rem",color:"var(--muted)",lineHeight:1.5,marginBottom:14}},scope==="forward"?"Days before today stay exactly as they are — only today and later change.":"⚠ Rebuilds all 7 days from Monday, replacing every day (including ones you may have already done this week)."),
      h("div",{style:{display:"flex",alignItems:"center",gap:8,fontSize:"0.66rem",color:"var(--muted)",marginBottom:12}},
        h("span",{style:{color:"var(--green)",fontWeight:700}},trainCount+" training days"),
        h("span",null,"·"),
        h("span",null,(7-trainCount)+" rest")),
      // per-day rows (tappable)

        ...DAY_DEFS.map((d,i)=>{ const title=preview[d.key]?.title||"—"; const tType=typeOfTitle(title); const frozen=scope==="forward"&&i<todayIdx; const isToday=d.key===todayKey; const pinned=!!pins[d.key];
          const prevTitle = i>0 ? (preview[keys[i-1]]?.title||"") : "";

            h("span",{style:{fontSize:"0.62rem",fontWeight:700,color:"var(--muted)",width:32}},d.label),
            h("span",{style:{width:8,height:8,borderRadius:"50%",background:colorFor(title),flexShrink:0}}),
            h("div",{style:{flex:1,minWidth:0}},
              h("div",{style:{display:"flex",alignItems:"center",gap:7}},
                h("span",{style:{fontSize:"0.82rem",fontWeight:700,color:tType==="REST"?"var(--muted)":"var(--text)"}},title),

// ═══════════════ MAIN APP ═══════════════
function App(){
  const [tab,setTab]=useState("workout");
  const [activeDay,setActiveDay]=useState(getTodayKey());
  const [plan,setPlan]=useState(()=>load(LS.plan,null)||defaultPlan());
  const [log,setLog]=useState(()=>load(LS.log,{}));      // { itemId: {sets:[idx], weights:{idx:val}, reps:{idx:val}} }
  const [history,setHistory]=useState(()=>load(LS.history,[]));
  const [completions,setCompletions]=useState(()=>load(LS.done,{})); // dayKey -> weekString it was completed in
  const [mode,setMode]=useState(()=>load(LS.mode,null));
  const [expanded,setExpanded]=useState({});
  const [showTimer,setShowTimer]=useState(false);
  const [editDay,setEditDay]=useState(null);
  const [replaceTarget,setReplaceTarget]=useState(null);
  const [showData,setShowData]=useState(false);
  const [showWeek,setShowWeek]=useState(false);
  const [showModeSelect,setShowModeSelect]=useState(false);
  const [confirm,setConfirm]=useState(null);
  const [toastState,setToastState]=useState(null);
  const [swap,setSwap]=useState(()=>load(LS.swap,{})); // dayKey -> stashed original day
  const [homeRot,setHomeRot]=useState(()=>load(LS.homeRot,0)); // advances each home day for variety
  const toast=(msg,action,onAction)=>setToastState({msg,action,onAction,k:uid()});

  useEffect(()=>{ save(LS.plan,plan); },[plan]);
  useEffect(()=>{ save(LS.log,log); },[log]);
  useEffect(()=>{ save(LS.history,history); },[history]);
  useEffect(()=>{ save(LS.swap,swap); },[swap]);
  useEffect(()=>{ save(LS.homeRot,homeRot); },[homeRot]);
  useEffect(()=>{ save(LS.done,completions); },[completions]);
  // On load / new week: expire completions from previous weeks and clear their leftover logs.
  useEffect(()=>{
    const wk=eestWeek();
    const stale=Object.keys(completions).filter(dk=>completions[dk]!==wk);
    if(stale.length){
      setCompletions(c=>{ const n={...c}; stale.forEach(dk=>delete n[dk]); return n; });
      setLog(l=>{ const n={...l}; stale.forEach(dk=>{ (plan[dk]?.items||[]).forEach(it=>delete n[it.id]); }); return n; });
    }
    // Migration: any workout already saved to History this week (under old code that
    // didn't track completions) should show as completed for its day.
    const add={};
    (history||[]).forEach(entry=>{
      if(entry && entry.dayKey && entry.date){
        if(eestWeek(new Date(entry.date))===wk && completions[entry.dayKey]!==wk){ add[entry.dayKey]=wk; }
      }
    });
    if(Object.keys(add).length){ setCompletions(c=>({...c,...add})); }
  },[]); // run once on mount
  useEffect(()=>{ if(mode){save(LS.mode,mode); save(LS.schema,SCHEMA);} },[mode]);

  // Back-stack registrations (topmost open layer handles the swipe / closes first).
  useBackHandler(tab!=="workout", ()=>setTab("workout"));            // base: tab → workout
  useBackHandler(showTimer, ()=>setShowTimer(false));
  useBackHandler(showWeek, ()=>setShowWeek(false));
  useBackHandler(showData, ()=>setShowData(false));
  useBackHandler(!!confirm, ()=>setConfirm(null));
  // editDay & replaceTarget register their own back-handlers inside their components.

  // Re-opened via the logo (mode already chosen) — quick level switch.
  if(!mode || showModeSelect) return h(ModeSelect,{current:mode,onBack:mode?()=>setShowModeSelect(false):null,onPick:m=>{setMode(m); setShowModeSelect(false); toast(m==="beginner"?"Beginner mode — curated, simple.":"Advanced mode — full library unlocked.");}});

  const day=plan[activeDay];
  const items=day.items||[];
  const curWeek=eestWeek();
  const dayCompleted=completions[activeDay]===curWeek;
  const isExpanded=id=>expanded[id];
  const getL=id=>log[id]||{sets:[],weights:{},reps:{}};
  const exDone=id=>{ if(dayCompleted) return true; const it=items.find(i=>i.id===id); const l=getL(id); return it&&l.sets.length>=it.sets&&it.sets>0; };
  const doneCount=dayCompleted?items.length:items.filter(i=>exDone(i.id)).length;
  const pct=items.length?Math.round((doneCount/items.length)*100):0;
  const ringR=26,C=2*Math.PI*ringR,offset=C-(pct/100)*C;

  const toggleExpand=id=>setExpanded(e=>({...e,[id]:!e[id]}));
  const toggleSet=(id,idx,total)=>setLog(l=>{ const cur=l[id]||{sets:[],weights:{},reps:{}}; const sets=cur.sets.includes(idx)?cur.sets.filter(x=>x!==idx):[...cur.sets,idx]; return {...l,[id]:{...cur,sets}}; });
  const toggleAll=(id,total)=>setLog(l=>{ const cur=l[id]||{sets:[],weights:{},reps:{}}; const all=cur.sets.length>=total; return {...l,[id]:{...cur,sets:all?[]:Array.from({length:total},(_,i)=>i)}}; });
  const setW=(id,idx,v)=>setLog(l=>{ const cur=l[id]||{sets:[],weights:{},reps:{}}; const nv=String(v).replace(",","."); const weights={...cur.weights,[idx]:nv}; let sets=cur.sets; const bothFilled=String(nv).trim()!==""&&String(cur.reps[idx]||"").trim()!==""; if(bothFilled&&!sets.includes(idx)) sets=[...sets,idx]; return {...l,[id]:{...cur,weights,sets}}; });
  const setR=(id,idx,v)=>setLog(l=>{ const cur=l[id]||{sets:[],weights:{},reps:{}}; const reps={...cur.reps,[idx]:v}; let sets=cur.sets; const bothFilled=String(v).trim()!==""&&String(cur.weights[idx]||"").trim()!==""; if(bothFilled&&!sets.includes(idx)) sets=[...sets,idx]; return {...l,[id]:{...cur,reps,sets}}; });
  const changeSets=(id,delta)=>{
    setPlan(p=>({...p,[activeDay]:{...p[activeDay],items:p[activeDay].items.map(it=>{ if(it.id!==id) return it; const ns=Math.max(1,Math.min(10,(parseInt(it.sets)||1)+delta)); return {...it,sets:ns}; })}}));
    if(delta<0){ // dropping a set: clear any logged data for the removed top index
      setLog(l=>{ const cur=l[id]; if(!cur) return l; const it=(plan[activeDay].items||[]).find(x=>x.id===id); const oldN=parseInt(it?.sets)||1; const removedIdx=oldN-1; const sets=cur.sets.filter(x=>x!==removedIdx); const weights={...cur.weights}; const reps={...cur.reps}; delete weights[removedIdx]; delete reps[removedIdx]; return {...l,[id]:{...cur,sets,weights,reps}}; });
    }
  };

  const finishDay=()=>{
    const exercises=items.map(it=>{ const l=getL(it.id); if(!l.sets.length) return null; return {name:it.name,cat:it.cat,sets:l.sets.sort((a,b)=>a-b).map(idx=>({set:idx+1,weight:l.weights[idx]||"",reps:l.reps[idx]||""}))}; }).filter(Boolean);
    if(!exercises.length){ toast("Log at least one set first"); setConfirm(null); return; }
    const entry={dayKey:activeDay,dayTitle:day.title||"Workout",date:Date.now(),exercises};
    setHistory(hh=>[...hh,entry]);
    setCompletions(c=>({...c,[activeDay]:eestWeek()})); // stays "done" until the week rolls over
    setConfirm(null);
    toast("Workout saved 💪 — stays done until Monday");
  };
  const lastLog=name=>{ for(let i=history.length-1;i>=0;i--){ const ex=(history[i].exercises||[]).find(e=>e.name===name); if(ex){ const mx=Math.max(0,...ex.sets.map(s=>parseFloat(s.weight)||0)); if(mx>0) return mx; } } return null; };

  const isSwapped=!!swap[activeDay];
  const clearDayLog=dk=>setLog(l=>{ const n={...l}; (plan[dk].items||[]).forEach(it=>delete n[it.id]); return n; });
  const swapToHome=()=>{
    clearDayLog(activeDay);
    const rot=homeRot;
    setSwap(s=>({...s,[activeDay]:plan[activeDay]}));   // stash original
    setPlan(p=>({...p,[activeDay]:homeDay(mode,rot)}));
    setHomeRot(r=>r+1);                                  // next home day differs
    setConfirm(null);
    toast("Switched to a home day 🏠");
  };
  const reshuffleHome=()=>{
    clearDayLog(activeDay);
    const rot=homeRot;
    setPlan(p=>({...p,[activeDay]:homeDay(mode,rot)}));
    setHomeRot(r=>r+1);
    toast("Home workout reshuffled 🔀");
  };
  const restoreDay=()=>{
    clearDayLog(activeDay);
    const original=swap[activeDay];
    setPlan(p=>({...p,[activeDay]:original}));
    setSwap(s=>{ const n={...s}; delete n[activeDay]; return n; });
    setConfirm(null);
    toast("Restored your "+(original.title||"original")+" day");
  };
  const applyWeek=(pins,scope)=>{
    const keys=DAY_DEFS.map(d=>d.key);
    const fromKey = scope==="full" ? keys[0] : getTodayKey();
    const fromIdx = keys.indexOf(fromKey);
    const newPlan = buildWeek(pins, fromKey, scope==="full"?null:plan);
    // clear in-progress logs for days that get rewritten (today-forward or all)
    setLog(l=>{ const n={...l}; keys.forEach((k,i)=>{ if(i>=fromIdx) (plan[k].items||[]).forEach(it=>delete n[it.id]); }); return n; });
    // any swapped-home stash on a rewritten day is now stale → drop it
    setSwap(s=>{ const n={...s}; keys.forEach((k,i)=>{ if(i>=fromIdx) delete n[k]; }); return n; });
    setPlan(newPlan);
    const tc=DAY_DEFS.filter(d=>typeOfTitle(newPlan[d.key]?.title)!=="REST").length;
    toast("Week updated — "+tc+" training day"+(tc!==1?"s":""));
  };

  const doReplace=(newEx)=>{
    const oldId=replaceTarget?.id;
    setLog(l=>{ const n={...l}; delete n[oldId]; return n; }); // clear old exercise's sets
    setPlan(p=>({...p,[activeDay]:{...p[activeDay],items:p[activeDay].items.map(i=>i.id===oldId?newEx:i)}}));
    setReplaceTarget(null);
    toast("Replaced with "+newEx.name);
  };

  return h("div",{style:{background:"var(--bg)",minHeight:"100vh",color:"var(--text)",maxWidth:640,margin:"0 auto",paddingBottom:"env(safe-area-inset-bottom)"}},

      h("span",{style:{fontSize:"1.8rem"}},o.icon),
      h("div",{style:{flex:1}},h("div",{style:{fontWeight:800,fontSize:"1.05rem",textTransform:"uppercase",color:o.col,marginBottom:4,display:"flex",alignItems:"center",gap:8}},o.title,active&&h("span",{style:{fontSize:"0.5rem",color:o.col,border:"1px solid "+o.col,borderRadius:10,padding:"1px 7px",letterSpacing:"0.06em"}},"Current")),h("div",{style:{fontSize:"0.76rem",color:"var(--muted)",lineHeight:1.55}},o.desc))); }),
    h("div",{style:{textAlign:"center",fontSize:"0.64rem",color:"var(--dim)",marginTop:16,lineHeight:1.6}},"Tap the Gym Coach logo anytime to return here. Your plan and history are kept."));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
